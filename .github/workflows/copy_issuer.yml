name: zzz temp copy issuer id
on: workflow_dispatch
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy FASTLANE_ISSUER_ID to LoopFollow fork
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUER: ${{ secrets.FASTLANE_ISSUER_ID }}
        run: printf '%s' "$ISSUER" | gh secret set FASTLANE_ISSUER_ID -R hwhitfield2/LoopFollow
