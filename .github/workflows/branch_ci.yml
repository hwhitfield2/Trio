name: Branch CI (build + unit tests)

# Compile check + unit tests for working branches. No signing, no TestFlight —
# simulator build only. Mirrors the upstream unit_tests.yml invocation.
#
# Runs two independent jobs in parallel: the Xcode build/test on macOS, and the
# oref dilution scale-invariance suite on Linux. The latter drives the shipped
# JavaScript bundles directly, so it is the only thing guarding the diluted-
# insulin dosing invariants against a bundle rebuild — and it needs neither
# Xcode nor the submodules, so it reports in seconds instead of ten minutes.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - '**.md'
      - 'ml/**'
      - 'docs/**'

jobs:
  oref:
    name: oref dilution invariants
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run dilution scale-invariance suite
        run: |
          set -o pipefail
          node trio-oref/tests/dilution-scale-invariance.test.js 2>&1 | tee oref-dilution.log

      - name: Annotate results
        if: always()
        run: |
          if [ -f oref-dilution.log ]; then
            if grep -q "^all scenarios passed" oref-dilution.log; then
              summary=$(grep "^all scenarios passed" oref-dilution.log)
              echo "::notice title=oref Dilution Invariants Passed::$summary"
              echo "✅ oref dilution invariants: $summary" >> $GITHUB_STEP_SUMMARY
            else
              echo "::error title=oref Dilution Invariants Failed::Scale invariance broken"
              echo "## ❌ oref dilution invariants failed:" >> $GITHUB_STEP_SUMMARY
              grep -E "^  FAIL|^[0-9]+ scenario" oref-dilution.log | \
                sed 's/^/  - /' >> $GITHUB_STEP_SUMMARY || true
            fi
          fi

  test:
    name: Build and run unit tests
    runs-on: macos-26

    steps:
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Restore cache
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            /Users/runner/Library/Developer/Xcode/DerivedData
            .build
          key: ${{ runner.os }}-trio-branchci-${{ hashFiles('**/*.swift', '**/*.xcodeproj', '**/*.xcworkspace') }}
          restore-keys: |
            ${{ runner.os }}-trio-branchci-
            ${{ runner.os }}-trio-

      - name: Build for testing
        run: |
          set -o pipefail && \
          time xcodebuild build-for-testing \
            -workspace Trio.xcworkspace \
            -scheme "Trio Tests" \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
            2>&1 | tee xcodebuild-build.log

      - name: Save cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            /Users/runner/Library/Developer/Xcode/DerivedData
            .build
          key: ${{ runner.os }}-trio-branchci-${{ hashFiles('**/*.swift', '**/*.xcodeproj', '**/*.xcworkspace') }}

      - name: Run tests
        run: |
          set -o pipefail
          time xcodebuild test-without-building \
            -workspace Trio.xcworkspace \
            -scheme "Trio Tests" \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
            2>&1 | tee xcodebuild.log

      - name: Annotate test results
        if: always()
        run: |
          if [ -f xcodebuild.log ]; then
            # XCTest failures print "Failing tests:"; Swift Testing failures
            # print "✘ Test ..." lines instead — check for both, or a failed
            # run gets summarized as "all tests passed".
            if grep -q "Failing tests:" xcodebuild.log || grep -q "✘ Test " xcodebuild.log; then
              echo "::error title=Unit Tests Failed::Some tests failed"
              echo "## ❌ Some tests failed:" >> $GITHUB_STEP_SUMMARY
              grep -A 20 "Failing tests:" xcodebuild.log | \
                grep -E '^\s+[A-Za-z0-9]+\..+\(\)' | \
                sed 's/^/  - /' >> $GITHUB_STEP_SUMMARY || true
              grep -E '✘ Test .* failed after' xcodebuild.log | \
                sed 's/^/  - /' | sort -u >> $GITHUB_STEP_SUMMARY || true
            else
              echo "::notice title=Unit Tests Passed::✅ All tests passed"
              echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
            fi
          fi
