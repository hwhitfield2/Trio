name: 3. Create Certificates
run-name: Create Certificates (${{ github.ref_name }})

# Provisions the follower's Distribution certificate and the two provisioning
# profiles "4. Build Trio Follower" needs. That build runs fastlane match in
# read-only mode (setup_ci forces it), so the profiles have to exist first —
# run this workflow once, and again whenever the certificate is renewed.
#
# The certificate lives in the same private Match-Secrets repository the Trio
# host build uses, so running this here does not invalidate anything there:
# match reuses the existing certificate and only adds the two follower
# profiles to it.
on: [workflow_call, workflow_dispatch]

env:
  TEAMID: ${{ secrets.TEAMID }}
  GH_PAT: ${{ secrets.GH_PAT }}
  GH_TOKEN: ${{ secrets.GH_PAT }}
  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
  FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
  FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
  FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit

  create_certs:
    name: Certificates
    needs: validate
    runs-on: macos-26
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      # Patch Fastlane Match to not print tables
      - name: Patch Match Tables
        run: |
          TABLE_PRINTER_PATH=$(ruby -e 'puts Gem::Specification.find_by_name("fastlane").gem_dir')/match/lib/match/table_printer.rb
          if [ -f "$TABLE_PRINTER_PATH" ]; then
            sed -i "" "/puts(Terminal::Table.new(params))/d" "$TABLE_PRINTER_PATH"
          else
            echo "table_printer.rb not found"
            exit 1
          fi

      - name: Install Project Dependencies
        run: bundle install

      # Sync the GitHub runner clock with the Windows time server (workaround as suggested in https://github.com/actions/runner/issues/2996)
      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Create or update the follower's certificate and profiles
        run: bundle exec fastlane certs
