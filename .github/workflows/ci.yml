name: CI (analyze + tests + builds)

# No signing, no TestFlight: runs the protocol/crypto tests, builds an
# installable Android APK artifact, and compile-checks the iOS side without
# codesigning. Everything here works on a fork with no secrets set.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:

jobs:
  analyze_and_test:
    name: Analyze and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare platform shells
        run: ./tool/prepare_platforms.sh

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

  android_apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze_and_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # When the (optional) FOLLOWER_GOOGLE_SERVICES_JSON secret is set, the
      # APK is built with FCM support so Android followers receive the host's
      # status pushes. Without it the APK still works for commands.
      - name: Prepare platform shells
        run: ./tool/prepare_platforms.sh
        env:
          FOLLOWER_GOOGLE_SERVICES_JSON: ${{ secrets.FOLLOWER_GOOGLE_SERVICES_JSON }}

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trio-follower-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Summary
        run: |
          echo "## 📱 Trio Follower Android APK" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from this run's artifacts and sideload it on the follower device." >> $GITHUB_STEP_SUMMARY
          if [ -f android/app/google-services.json ]; then
            echo "FCM: **enabled** (status pushes will work)" >> $GITHUB_STEP_SUMMARY
          else
            echo "FCM: **not configured** — add the \`FOLLOWER_GOOGLE_SERVICES_JSON\` repository secret to enable live status on Android." >> $GITHUB_STEP_SUMMARY
          fi

  ios_compile_check:
    name: iOS compile check (no codesign)
    runs-on: macos-26
    needs: analyze_and_test
    steps:
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # For the xcodeproj gem, which adds the widget extension target.
      - name: Install Ruby dependencies
        run: bundle install

      - name: Prepare platform shells
        run: bundle exec ./tool/prepare_platforms.sh
        env:
          # Only decides the app group id baked into the widget's entitlements.
          # Any value builds, because this job never signs — the point is to
          # compile the widget's Swift.
          TEAMID: CI0000TEST

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
